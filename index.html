<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>心智动力 · 英语特工</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Header-logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F2FAFF; font-family: 'Segoe UI','Poppins',system-ui,sans-serif; padding: 20px 16px 40px; color: #2C3E50; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; background: #0288D1; padding: 12px 20px; border-radius: 48px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.8rem; background: linear-gradient(135deg,#0288D1,#4FC3F7,#C6F91F); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sub { color: #607D8B; font-weight: 500; font-size: 0.9rem; }
        .tabs { display: flex; gap: 8px; background: #E3F9FF; border-radius: 60px; padding: 6px; margin-bottom: 24px; flex-wrap: wrap; }
        .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 40px; font-weight: 600; background: transparent; color: #607D8B; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .tab.active { background: #4FC3F7; color: #fff; box-shadow: 0 2px 8px rgba(79,195,247,0.3); }
        .card { background: #fff; border-radius: 32px; border: 1px solid #B8DDF5; padding: 20px 18px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 16px; border-left: 5px solid #4FC3F7; padding-left: 14px; color: #0288D1; }
        button,.btn { background: #4FC3F7; border: none; padding: 10px 20px; border-radius: 60px; font-weight: bold; color: #fff; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        button.secondary { background: #E3F9FF; color: #0288D1; }
        button.small { padding: 6px 14px; font-size: 0.8rem; }
        button.danger { background: #FF7043; }
        .filter-bar { background: #E3F9FF; border-radius: 40px; padding: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filter-select { background: #fff; border: 1px solid #B8DDF5; border-radius: 40px; padding: 6px 12px; }
        .flashcard { background: #fff; border-radius: 28px; padding: 30px 20px; margin-bottom: 20px; cursor: pointer; border: 2px solid #B8DDF5; box-shadow: 0 4px 12px rgba(79,195,247,0.1); transition: 0.2s; }
        .flashcard:hover { background: #E3F9FF; }
        .question-text { font-size: 1.8rem; font-weight: bold; color: #0288D1; margin: 20px 0; text-align: center; }
        .answer-text { text-align: center; margin-top: 20px; border-top: 2px dashed #B8DDF5; padding-top: 20px; }
        .answer-text > div { display: inline-block; text-align: center; line-height: 1.8; max-width: 92%; }
        .answer-text .center-block { text-align: center; display: block; max-width: 90%; margin: 8px auto 0; line-height: 1.8; }
        .note-container { margin-top: 16px; border-top: 1px dashed #B8DDF5; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .note-btn { background: #FFD54F; color: #2C3E50; border: none; border-radius: 40px; padding: 8px 16px; cursor: pointer; font-size: 0.9rem; }
        .note-btn.has-note { background: #4FC3F7; color: #fff; }
        .note-btn.fav-btn { background: #ECEFF1; color: #78909C; }
        .note-btn.fav-btn.fav-active { background: #FFB300; color: #fff; }
        .note-area { width: 100%; min-height: 80px; margin-top: 10px; padding: 12px; border: 1px solid #B8DDF5; border-radius: 16px; font-size: 0.9rem; resize: vertical; font-family: inherit; }
        .progress { background: #E3F9FF; border-radius: 40px; height: 8px; width: 100%; margin: 12px 0; }
        .progress-fill { background: #4FC3F7; height: 8px; border-radius: 40px; transition: width 0.3s; }
        .btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .essay-content { background: #F0FDFF; border-radius: 24px; padding: 16px; line-height: 1.6; }
        .essay-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #E3F9FF; }
        .essay-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .grammar-item { background: #F0FDFF; border-radius: 20px; padding: 16px; margin-bottom: 12px; cursor: pointer; border: 1px solid #E3F9FF; transition: 0.2s; }
        .grammar-item:hover { border-color: #4FC3F7; }
        .grammar-detail { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #B8DDF5; font-size: 0.9rem; line-height: 1.6; }
        .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #2C3E2F; color: #fff; padding: 10px 24px; border-radius: 60px; z-index: 2000; font-size: 0.9rem; animation: toastIn .3s ease; }
        @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
        .modal-overlay { position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.5); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #fff; border-radius: 24px; padding: 24px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #607D8B; padding: 4px 8px; }
        .modal-close:hover { color: #2C3E50; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin: 16px 0; }
        .stat-card { background: #F0FDFF; border-radius: 16px; padding: 16px; text-align: center; }
        .stat-card .num { font-size: 2rem; font-weight: bold; color: #0288D1; }
        .stat-card .label { font-size: 0.8rem; color: #607D8B; margin-top: 4px; }
        .quality-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .quality-btns button { min-width: 60px; text-align: center; }
        .q-wrong { background: #FFCDD2 !important; color: #C62828 !important; }
        .q-hard { background: #FFE0B2 !important; color: #E65100 !important; }
        .q-ok { background: #E3F9FF !important; color: #0288D1 !important; }
        .q-good { background: #C8E6C9 !important; color: #2E7D32 !important; }
        .q-easy { background: #B2DFDB !important; color: #00695C !important; }
        .kbd-hint { text-align: center; font-size: 0.7rem; color: #B0BEC5; margin-top: 8px; }
        .kbd { background: #ECEFF1; padding: 1px 6px; border-radius: 4px; font-family: monospace; }
        footer { text-align: center; margin-top: 32px; color: #607D8B; font-size: 0.7rem; }
        .phonetic { color: #607D8B; font-style: italic; margin-left: 8px; }
        .flashcard img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 8px; }
        @media(max-width:768px) {
            .container { max-width: 100%; }
            .question-text { font-size: 1.4rem; }
            .flashcard { padding: 20px 12px; }
            .btn-group { gap: 8px; }
            button,.btn { padding: 6px 12px; font-size: 0.8rem; }
            .quality-btns button { min-width: 48px; font-size: 0.75rem; padding: 5px 8px; }
            .modal { padding: 16px; border-radius: 20px; }
        }
        /* ========== 打印/导出生词表样式 ========== */
        .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-actions .btn:disabled, .btn:disabled { opacity: .45; cursor: not-allowed; }
        @media print { .filter-actions, .filter-bar, .tabs, .header, footer, .btn-group, .quality-btns, .kbd-hint, .note-container, .progress { display: none !important; } }
        /* ========== 海绵宝宝激励系统样式（蓝色主界面风格不变）========== */
        .sponge-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#FFF8E1,#FFECB3); color: #5D4037; padding: 14px 28px; border-radius: 60px; z-index: 2100; font-size: 0.95rem; font-weight: 600; box-shadow: 0 6px 24px rgba(255,213,79,0.4); border: 2px solid #FFD54F; animation: spongeBounce .4s ease; white-space: nowrap; }
        .sponge-toast .emoji { font-size: 1.3rem; margin: 0 4px; }
        @keyframes spongeBounce { 0%{opacity:0;transform:translateX(-50%) scale(0.8);} 50%{transform:translateX(-50%) scale(1.05);} 100%{opacity:1;transform:translateX(-50%) scale(1);} }
        .milestone-toast { background: linear-gradient(135deg,#FFD54F,#FFB300) !important; color: #3E2723 !important; font-size: 1rem !important; border-color: #FFA000 !important; box-shadow: 0 8px 32px rgba(255,179,0,0.5) !important; animation: milestonePop .5s ease !important; }
        @keyframes milestonePop { 0%{transform:translateX(-50%) scale(0.5);opacity:0;} 60%{transform:translateX(-50%) scale(1.1);} 100%{transform:translateX(-50%) scale(1);opacity:1;} }
        .sponge-panel { background: #FFF8E1 !important; border-color: #FFE082 !important; }
        .sponge-panel .card-title { color: #E65100 !important; border-left-color: #FFB300 !important; }
        .streak-badge { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg,#FF8A65,#FF7043); color: #fff; padding: 4px 14px; border-radius: 40px; font-weight: 700; font-size: 0.9rem; animation: streakPulse 2s ease infinite; }
        @keyframes streakPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,112,67,0.4);} 50%{box-shadow:0 0 0 8px rgba(255,112,67,0);} }
        .daily-ring-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto; }
        .daily-ring-wrap .ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
        .daily-ring-wrap .ring-num { font-size: 1.8rem; font-weight: bold; color: #0288D1; }
        .daily-ring-wrap .ring-label { font-size: 0.7rem; color: #607D8B; }
        .weak-word { background: #FFF3E0; border: 1px solid #FFE0B2; border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .weak-word:hover { border-color: #FFB74D; background: #FFE0B2; }
        .weak-word .word-en { font-weight: bold; color: #E65100; font-size: 1rem; }
        .weak-word .word-cn { color: #8D6E63; font-size: 0.85rem; }
        .weak-word .word-rate { font-size: 0.8rem; color: #D84315; font-weight: 600; }
        .star-bar { display: flex; align-items: end; gap: 6px; height: 80px; padding: 0 8px; }
        .star-bar .bar { flex: 1; background: linear-gradient(to top,#81C784,#A5D6A7); border-radius: 6px 6px 0 0; min-width: 24px; position: relative; transition: height 0.5s ease; }
        .star-bar .bar .bar-count { position: absolute; top: -18px; width: 100%; text-align: center; font-size: 0.7rem; color: #607D8B; }
        .star-bar .bar .bar-label { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 0.7rem; color: #607D8B; }
        .suggest-card { background: linear-gradient(135deg,#E3F9FF,#B8DDF5); border-radius: 16px; padding: 14px; margin-top: 12px; border: 1px dashed #4FC3F7; }
        .suggest-card .suggest-icon { font-size: 1.5rem; margin-right: 6px; }
        .sponge-modal { background: linear-gradient(180deg,#FFF8E1,#fff) !important; border: 3px solid #FFD54F !important; }

        /* ====== 学习激励仪表盘 ====== */
        .dashboard-card { background: #fff; border-radius: 20px; padding: 18px 22px 14px; margin-bottom: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
        .dash-stats { display: flex; gap: 6px; margin-bottom: 10px; }
        .dash-stat { flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px; }
        .dash-stat-total { background: #E3F9FF; }
        .dash-stat-learned { background: #E0F7FA; }
        .dash-stat-rate { background: #F3E5F5; }
        .dash-stat-level { background: #E8F5E9; }
        .dash-stat-points { background: #FFF8E1; }
        .dash-stat-num { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
        .dash-stat-total .dash-stat-num { color: #0288D1; }
        .dash-stat-learned .dash-stat-num { color: #00838F; }
        .dash-stat-rate .dash-stat-num { color: #7B1FA2; }
        .dash-stat-level .dash-stat-num { color: #2E7D32; }
        .dash-stat-points .dash-stat-num { color: #F57F17; }
        .dash-stat-label { font-size: 0.68rem; color: #78909C; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 微型数据带 */
        .dash-micro-row { display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid #F0F0F0; flex-wrap: wrap; }
        .dash-micro-item { display: flex; align-items: center; gap: 4px; font-size: 0.73rem; color: #607D8B; white-space: nowrap; }
        .dash-micro-progress { flex: 1; min-width: 80px; height: 6px; background: #E0E0E0; border-radius: 3px; overflow: hidden; }
        .dash-micro-progress-fill { height: 100%; background: linear-gradient(90deg, #4FC3F7, #81C784); border-radius: 3px; transition: width 0.6s; }
        .dash-micro-cd { font-weight: 600; color: #E65100; }
        .dash-progress-row { display: none; }
        @media (max-width:480px) {
          .dash-stats { flex-wrap: wrap; }
          .dash-stat { flex: 1 1 30%; }
          .dash-micro-row { gap: 6px; font-size: 0.7rem; }
        }

        /* ====== 激励系统：倒计时 + 连击 + 等级 + 成就 v2.2 紧凑版 ====== */
        .countdown-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .countdown-item { flex: 1; min-width: 100px; background: linear-gradient(135deg,#E3F9FF,#B8DDF5); border-radius: 12px; padding: 10px; text-align: center; position: relative; }
        .countdown-item.urgent { background: linear-gradient(135deg,#FFF3E0,#FFE0B2); }
        .countdown-item.urgent .cd-num { color: #E65100; }
        .countdown-name { font-size: 0.7rem; color: #78909C; margin-bottom: 2px; }
        .countdown-item.urgent .countdown-name { color: #BF360C; }
        .cd-num { font-size: 1.3rem; font-weight: 800; color: #0288D1; line-height: 1.1; }
        .cd-unit { font-size: 0.7rem; color: #78909C; }
        .countdown-settings-btn { display: inline-block; cursor: pointer; font-size: 0.85rem; color: #4FC3F7; margin-left: 6px; transition: transform 0.2s; }
        .countdown-settings-btn:hover { transform: rotate(60deg); }
        /* 两列网格 */
        .report-col2 { display: flex; gap: 8px; flex-wrap: wrap; }
        .report-col2 > * { flex: 1; min-width: 140px; }
        /* 紧凑统计行 */
        .report-stat-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 0.78rem; color: #607D8B; }
        .report-stat-row .stat-dot { width: 4px; height: 4px; border-radius: 50%; background: #B0BEC5; margin: 0 3px; }
        /* 连击+等级 并排 */
        .combo-card { background: linear-gradient(135deg,#FCE4EC,#F8BBD0); border-radius: 12px; padding: 8px 12px; text-align: center; }
        .combo-card .combo-num { font-size: 1.4rem; font-weight: 800; color: #C62828; }
        .combo-card .combo-label { font-size: 0.68rem; color: #880E4F; }
        .level-card { background: linear-gradient(135deg,#E8F5E9,#C8E6C9); border-radius: 12px; padding: 8px 12px; }
        .level-card .level-title { font-weight: 700; color: #2E7D32; font-size: 0.85rem; }
        .level-bar-wrap { background: #E0E0E0; border-radius: 6px; height: 8px; overflow: hidden; margin: 3px 0; }
        .level-bar-fill { height: 100%; background: linear-gradient(90deg,#FFD54F,#FFB300); border-radius: 6px; transition: width 0.5s ease; }
        /* 掌握率进度条 */
        .mastery-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .mastery-bar .progress { flex: 1; margin: 0; }
        .mastery-bar .progress-label { font-size: 0.78rem; color: #607D8B; white-space: nowrap; min-width: 50px; text-align: right; }
        /* 弱点词 pill 标签 */
        .weak-pill { display: inline-block; background: #FFCDD2; border-radius: 12px; padding: 2px 8px; margin: 2px; font-size: 0.72rem; color: #C62828; white-space: nowrap; }
        /* 今日洞察网格 */
        .insight-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .insight-item { background: #F8FAFB; border-radius: 10px; padding: 10px 6px; text-align: center; border: 1px solid #ECEFF1; transition: all 0.2s; }
        .insight-item:hover { background: #E3F9FF; border-color: #B8DDF5; }
        .insight-value { font-size: 1.25rem; font-weight: 800; color: #0288D1; line-height: 1.2; }
        .insight-label { font-size: 0.72rem; color: #607D8B; margin-top: 2px; }
        .insight-sub { font-size: 0.65rem; color: #90A4AE; margin-top: 1px; }
        /* 到期遗忘警告条 */
        .due-alert { background: #FFF3E0; border: 1px solid #FFCC80; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #E65100; }
        .report-collapse-toggle { font-size: 0.8rem; color: #4FC3F7; cursor: pointer; user-select: none; }
        .report-collapse-toggle:hover { color: #0288D1; }
        .report-collapse-body { display: none; padding-top: 8px; }
        .report-collapse-body.open { display: block; }
        /* 成就徽章面板（蓝色主题匹配） */
        .badge-panel { background: linear-gradient(135deg, #E3F9FF, #E1F5FE); border: 1.5px solid #B8DDF5; border-radius: 12px; padding: 12px; }
        .badge-panel-title { font-size: 13px; font-weight: 700; color: #0288D1; margin-bottom: 8px; }
        .badge-grid-compact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .achievement-badge { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: 8px; border: 1.5px solid #B8DDF5; background: #fff; text-align: center; transition: all 0.2s; filter: grayscale(100%); opacity: 0.45; }
        .achievement-badge.unlocked { filter: grayscale(0%); opacity: 1; border-color: #4FC3F7; background: linear-gradient(135deg, #E3F9FF, #B3E5FC); box-shadow: 0 2px 8px rgba(79,195,247,0.25); }
        .achievement-badge.unlocked .ach-name { color: #01579B; }
        .achievement-badge.unlocked .ach-desc { color: #333; }
        .achievement-badge.unlocked .ach-progress { color: #0277BD; }
        .achievement-badge .ach-icon { font-size: 22px; }
        .achievement-badge .ach-name { font-size: 12px; font-weight: 600; margin-top: 2px; color: #0277BD; }
        .achievement-badge .ach-desc { font-size: 10px; color: #90A4AE; margin-top: 1px; }
        .achievement-badge .ach-progress { font-size: 10px; color: #4FC3F7; margin-top: 1px; font-weight: 600; }
        /* 数据管理网格卡片 */
        .data-mgmt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .data-mgmt-card { background: #fff; border: 1.5px solid #E3F2FD; border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .data-mgmt-card:hover { background: #E3F9FF; border-color: #4FC3F7; transform: translateY(-1px); box-shadow: 0 3px 10px rgba(2,136,209,0.12); }
        .data-mgmt-card .dmg-icon { font-size: 24px; margin-bottom: 4px; }
        .data-mgmt-card .dmg-title { font-size: 0.8rem; font-weight: 700; color: #1565C0; }
        .data-mgmt-card .dmg-desc { font-size: 0.65rem; color: #78909C; margin-top: 2px; line-height: 1.3; }
        .data-mgmt-card.danger { border-color: #FFCDD2; }
        .data-mgmt-card.danger:hover { background: #FFEBEE; border-color: #EF9A9A; }
        .data-mgmt-card.danger .dmg-title { color: #C62828; }
        /* ====== 蓝色折叠数据面板（与标题栏 #0288D1 统一） ====== */
        .data-panel-purple { background: linear-gradient(135deg,#E3F9FF,#B8DDF5); border: 1.5px solid #4FC3F7; border-radius: 20px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(2,136,209,0.10); }
        .data-panel-header { display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; color: #01579B; font-size: 1.05rem; font-weight: 700; }
        .data-panel-header .data-panel-arrow { position: absolute; right: 2px; color: #0288D1; font-size: 0.85rem; transition: transform 0.2s; }
        .data-panel-hint { font-size: 0.78rem; color: #0277BD; text-align: center; margin-top: 10px; line-height: 1.5; }
        .data-panel-hint .hint-light { color: #0288D1; font-weight: 600; }
        .mp-header { flex-shrink: 0; position: relative; }
        .mp-header-brand { background: linear-gradient(135deg, #8B5CF6, #F472B6); padding: 22px 24px; text-align: center; color: #fff; }
        .mp-header-brand .mp-header-title { font-size: 34px; font-weight: 800; line-height: 1.3; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; }
        .mp-header-brand .mp-header-logo { width: 42px; height: 42px; flex-shrink: 0; margin-right: 8px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.2); vertical-align: middle; }
        .mp-header-brand .mp-header-subtitle { font-size: 16px; font-weight: 600; opacity: 0.95; line-height: 1.5; margin-top: 4px; }
        .mp-header-brand .mp-header-tagline { font-size: 14px; opacity: 0.88; line-height: 1.5; margin-top: 4px; }
