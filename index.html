<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>海绵宝宝成长记 · 英语特工 v1.8</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #FFF8F0; font-family: 'Segoe UI','Poppins',system-ui,sans-serif; padding: 20px 16px 40px; color: #2C3E50; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; background: #252540; padding: 12px 20px; border-radius: 48px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.8rem; background: linear-gradient(135deg,#4FC3F7,#29B6F6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sub { color: #607D8B; font-weight: 500; font-size: 0.9rem; }
        .tabs { display: flex; gap: 8px; background: #E3F4FF; border-radius: 60px; padding: 6px; margin-bottom: 24px; flex-wrap: wrap; }
        .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 40px; font-weight: 600; background: transparent; color: #607D8B; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .tab.active { background: #4FC3F7; color: #fff; box-shadow: 0 2px 8px rgba(79,195,247,0.3); }
        .card { background: #fff; border-radius: 32px; border: 1px solid #B3E5FC; padding: 20px 18px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 16px; border-left: 5px solid #4FC3F7; padding-left: 14px; color: #1565C0; }
        button,.btn { background: #4FC3F7; border: none; padding: 10px 20px; border-radius: 60px; font-weight: bold; color: #fff; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        button.secondary { background: #E3F4FF; color: #0288D1; }
        button.small { padding: 6px 14px; font-size: 0.8rem; }
        button.danger { background: #FF7043; }
        .filter-bar { background: #E3F4FF; border-radius: 40px; padding: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filter-select { background: #fff; border: 1px solid #B3E5FC; border-radius: 40px; padding: 6px 12px; }
        .flashcard { background: #fff; border-radius: 28px; padding: 30px 20px; margin-bottom: 20px; cursor: pointer; border: 2px solid #B3E5FC; box-shadow: 0 4px 12px rgba(79,195,247,0.1); transition: 0.2s; }
        .flashcard:hover { background: #E1F5FE; }
        .question-text { font-size: 1.8rem; font-weight: bold; color: #0277BD; margin: 20px 0; text-align: center; }
        .answer-text { text-align: center; margin-top: 20px; border-top: 2px dashed #B3E5FC; padding-top: 20px; }
        .answer-text > div { display: inline-block; text-align: center; line-height: 1.8; max-width: 92%; }
        .answer-text .center-block { text-align: center; display: block; max-width: 90%; margin: 8px auto 0; line-height: 1.8; }
        .note-container { margin-top: 16px; border-top: 1px dashed #B3E5FC; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .note-btn { background: #FFD54F; color: #2C3E50; border: none; border-radius: 40px; padding: 8px 16px; cursor: pointer; font-size: 0.9rem; }
        .note-btn.has-note { background: #4FC3F7; color: #fff; }
        .note-area { width: 100%; min-height: 80px; margin-top: 10px; padding: 12px; border: 1px solid #B3E5FC; border-radius: 16px; font-size: 0.9rem; resize: vertical; font-family: inherit; }
        .progress { background: #E1F5FE; border-radius: 40px; height: 8px; width: 100%; margin: 12px 0; }
        .progress-fill { background: #4FC3F7; height: 8px; border-radius: 40px; transition: width 0.3s; }
        .btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .essay-content { background: #F5FBFF; border-radius: 24px; padding: 16px; line-height: 1.6; }
        .essay-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #E1F5FE; }
        .essay-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .grammar-item { background: #F5FBFF; border-radius: 20px; padding: 16px; margin-bottom: 12px; cursor: pointer; border: 1px solid #E1F5FE; transition: 0.2s; }
        .grammar-item:hover { border-color: #4FC3F7; }
        .grammar-detail { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #B3E5FC; font-size: 0.9rem; line-height: 1.6; }
        .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #2C3E2F; color: #fff; padding: 10px 24px; border-radius: 60px; z-index: 2000; font-size: 0.9rem; animation: toastIn .3s ease; }
        @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
        .modal-overlay { position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.5); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #fff; border-radius: 24px; padding: 24px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #607D8B; padding: 4px 8px; }
        .modal-close:hover { color: #2C3E50; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin: 16px 0; }
        .stat-card { background: #F5FBFF; border-radius: 16px; padding: 16px; text-align: center; }
        .stat-card .num { font-size: 2rem; font-weight: bold; color: #0277BD; }
        .stat-card .label { font-size: 0.8rem; color: #607D8B; margin-top: 4px; }
        .quality-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .quality-btns button { min-width: 60px; text-align: center; }
        .q-wrong { background: #FFCDD2 !important; color: #C62828 !important; }
        .q-hard { background: #FFE0B2 !important; color: #E65100 !important; }
        .q-ok { background: #E3F4FF !important; color: #0288D1 !important; }
        .q-good { background: #C8E6C9 !important; color: #2E7D32 !important; }
        .q-easy { background: #B2DFDB !important; color: #00695C !important; }
        .kbd-hint { text-align: center; font-size: 0.7rem; color: #B0BEC5; margin-top: 8px; }
        .kbd { background: #ECEFF1; padding: 1px 6px; border-radius: 4px; font-family: monospace; }
        footer { text-align: center; margin-top: 32px; color: #607D8B; font-size: 0.7rem; }
        .phonetic { color: #607D8B; font-style: italic; margin-left: 8px; }
        .flashcard img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 8px; }
        @media(max-width:768px) {
            .container { max-width: 100%; }
            .question-text { font-size: 1.4rem; }
            .flashcard { padding: 20px 12px; }
            .btn-group { gap: 8px; }
            button,.btn { padding: 6px 12px; font-size: 0.8rem; }
            .quality-btns button { min-width: 48px; font-size: 0.75rem; padding: 5px 8px; }
            .modal { padding: 16px; border-radius: 20px; }
        }
        /* ========== 海绵宝宝激励系统样式（蓝色主界面风格不变）========== */
        .sponge-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#FFF8E1,#FFECB3); color: #5D4037; padding: 14px 28px; border-radius: 60px; z-index: 2100; font-size: 0.95rem; font-weight: 600; box-shadow: 0 6px 24px rgba(255,213,79,0.4); border: 2px solid #FFD54F; animation: spongeBounce .4s ease; white-space: nowrap; }
        .sponge-toast .emoji { font-size: 1.3rem; margin: 0 4px; }
        @keyframes spongeBounce { 0%{opacity:0;transform:translateX(-50%) scale(0.8);} 50%{transform:translateX(-50%) scale(1.05);} 100%{opacity:1;transform:translateX(-50%) scale(1);} }
        .milestone-toast { background: linear-gradient(135deg,#FFD54F,#FFB300) !important; color: #3E2723 !important; font-size: 1rem !important; border-color: #FFA000 !important; box-shadow: 0 8px 32px rgba(255,179,0,0.5) !important; animation: milestonePop .5s ease !important; }
        @keyframes milestonePop { 0%{transform:translateX(-50%) scale(0.5);opacity:0;} 60%{transform:translateX(-50%) scale(1.1);} 100%{transform:translateX(-50%) scale(1);opacity:1;} }
        .sponge-panel { background: #FFF8E1 !important; border-color: #FFE082 !important; }
        .sponge-panel .card-title { color: #E65100 !important; border-left-color: #FFB300 !important; }
        .streak-badge { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg,#FF8A65,#FF7043); color: #fff; padding: 4px 14px; border-radius: 40px; font-weight: 700; font-size: 0.9rem; animation: streakPulse 2s ease infinite; }
        @keyframes streakPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,112,67,0.4);} 50%{box-shadow:0 0 0 8px rgba(255,112,67,0);} }
        .daily-ring-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto; }
        .daily-ring-wrap .ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
        .daily-ring-wrap .ring-num { font-size: 1.8rem; font-weight: bold; color: #0277BD; }
        .daily-ring-wrap .ring-label { font-size: 0.7rem; color: #607D8B; }
        .weak-word { background: #FFF3E0; border: 1px solid #FFE0B2; border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .weak-word:hover { border-color: #FFB74D; background: #FFE0B2; }
        .weak-word .word-en { font-weight: bold; color: #E65100; font-size: 1rem; }
        .weak-word .word-cn { color: #8D6E63; font-size: 0.85rem; }
        .weak-word .word-rate { font-size: 0.8rem; color: #D84315; font-weight: 600; }
        .star-bar { display: flex; align-items: end; gap: 6px; height: 80px; padding: 0 8px; }
        .star-bar .bar { flex: 1; background: linear-gradient(to top,#81C784,#A5D6A7); border-radius: 6px 6px 0 0; min-width: 24px; position: relative; transition: height 0.5s ease; }
        .star-bar .bar .bar-count { position: absolute; top: -18px; width: 100%; text-align: center; font-size: 0.7rem; color: #607D8B; }
        .star-bar .bar .bar-label { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 0.7rem; color: #607D8B; }
        .suggest-card { background: linear-gradient(135deg,#E1F5FE,#B3E5FC); border-radius: 16px; padding: 14px; margin-top: 12px; border: 1px dashed #4FC3F7; }
        .suggest-card .suggest-icon { font-size: 1.5rem; margin-right: 6px; }
        .sponge-modal { background: linear-gradient(180deg,#FFF8E1,#fff) !important; border: 3px solid #FFD54F !important; }
    </style>
</head>
